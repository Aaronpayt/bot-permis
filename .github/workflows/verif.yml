name: Verif permis

on:
  schedule:
    - cron: "*/5 * * * *"   # toutes les 5 minutes (minimum GitHub)
  workflow_dispatch:          # bouton pour lancer à la main

# Jamais deux vérifications en même temps
concurrency:
  group: verif-permis
  cancel-in-progress: false

jobs:
  verif:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      # Récupère la liste des dates déjà envoyées par mail
      - name: Charger les dates déjà signalées
        uses: actions/cache/restore@v4
        with:
          path: deja_envoye.txt
          key: deja-envoye-${{ github.run_id }}
          restore-keys: deja-envoye-

      - name: Vérifier les dates
        run: python verif_permis.py
        env:
          AIBV_EMAIL: ${{ secrets.AIBV_EMAIL }}
          AIBV_MDP: ${{ secrets.AIBV_MDP }}
          GMAIL_ADRESSE: ${{ secrets.GMAIL_ADRESSE }}
          GMAIL_MDP_APP: ${{ secrets.GMAIL_MDP_APP }}
          DATE_LIMITE: ${{ vars.DATE_LIMITE }}
          CENTRES: ${{ vars.CENTRES }}

      # Sauvegarde la liste pour le prochain run
      - name: Sauver les dates signalées
        if: always() && hashFiles('deja_envoye.txt') != ''
        uses: actions/cache/save@v4
        with:
          path: deja_envoye.txt
          key: deja-envoye-${{ github.run_id }}

      - name: Captures en cas d'erreur
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures
          path: "*.png"
          if-no-files-found: ignore
